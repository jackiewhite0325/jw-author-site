<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigil and Scribe LLC - Interactive Library</title>
    <!-- FIXED: Added the exact direct path to the functional library script file instead of the home website -->
    <script src="https://aframe.io"></script>
    <style>
        /* Interactive Overlay Modals for Books and Props */
        .library-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background: #f4ebd0; /* Vintage Paper Texture Color */
            border: 8px double #5c4033; /* Victorian Dark Wood Accent */
            padding: 30px;
            box-shadow: 0 10px 3px rgba(0,0,0,0.5);
            z-index: 9999;
            font-family: 'Georgia', serif;
            color: #2b1d0c;
        }
        .modal-active { display: block; }
        .close-btn { float: right; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 2D Overlay Interface: Card Catalog Drawer (Mobile Optimized) -->
    <div id="cardCatalogDrawer" style="position:fixed; bottom:20px; left:20px; z-index:100; background:#3e2723; color:#fff; padding:15px; border-radius:4px; font-family:serif; max-width: 90vw;">
        <h3>📜 Card Catalog Drawer</h3>
        <input type="text" id="catalogSearch" placeholder="Search Title, Author, or Genre..." style="padding:5px; width:200px;">
        <div id="catalogResults" style="max-height:150px; overflow-y:auto; margin-top:10px;"></div>
    </div>

    <!-- UI Overlay for Reading Text (About, Blog, and Memorial Pages) -->
    <div id="parchmentModal" class="library-modal">
        <span class="close-btn" onclick="closeParchment()">✕ Close</span>
        <h2 id="modalTitle"></h2>
        <div id="modalContent"></div>
    </div>

    <!-- 3D 360° Virtual Library Environment Scene -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <!-- Accurate path matching your nested site subfolder and .png file extension -->
            <img id="libraryRoom" src="./images/site/victorian_library_360.png" crossorigin="anonymous">
        </a-assets>

        <!-- Main 360 Background Sphere centering the user -->
        <a-sky src="#libraryRoom" rotation="0 -90 0"></a-sky>

        <!-- Invisible/Semi-transparent clickable hot-spots aligned to the room imagery -->
        
        <!-- PROP 1: Muffin's Memorial Poster on the Wall -->
        <a-plane id="muffinPoster" position="-3 2 -4" rotation="0 45 0" width="1.5" height="2" 
                 material="opacity: 0.1; color: #ffeb3b" class="clickable"
                 onclick="openParchment('Muffin\'s Memorial', 'In loving memory of the dog who inspired it all. Here lies the foundation of our creative stories.')"></a-plane>

        <!-- PROP 2: Librarian's Desk Papers & Quill (About Section) -->
        <a-box id="aboutDeskPapers" position="0 -1 -3" width="1" height="0.2" depth="0.8"
               material="opacity: 0.1; color: #00bcd4" class="clickable"
               onclick="openParchment('About Sigil and Scribe LLC', 'Welcome to our collaborative library. We publish works across Fiction, Wellness, and Children\'s genres from multiple authors.')"></a-box>

        <!-- PROP 3: Librarian's Desk Typewriter (Blog Section) -->
        <a-box id="blogTypewriter" position="1 -1 -3" width="0.6" height="0.4" depth="0.6"
               material="opacity: 0.1; color: #4caf50" class="clickable"
               onclick="openParchment('The Scribe\'s Blog', 'Latest Update: Transitioning to our multi-author platform! Stay tuned for upcoming catalog additions from our writing partners.')"></a-box>

        <!-- FIXED: Re-added the device look-controls viewpoint camera system -->
        
    </a-scene>

    <script src="./js/library-engine.js"></script>
</body>
</html>
