<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigil and Scribe LLC — Interactive Library</title>
    
    <!-- Primary Typography Anchors -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Functional Visual Style Links -->
    <link rel="stylesheet" href="css/catalog.css">
    <link rel="stylesheet" href="css/shelves.css">
    
    <style>
        /* Room Blueprint constraints for your layout layout */
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #FDFBF7; /* Smooth room paper color matches theme tokens */
            font-family: 'Inter', sans-serif;
        }
        
        .library-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 60px;
            align-items: flex-start;
        }

        .catalog-wing {
            flex: 0 0 320px;
            position: sticky;
            top: 40px;
        }

        .shelves-wing {
            flex: 1;
        }

        @media (max-width: 992px) {
            .library-container {
                flex-direction: column;
                gap: 40px;
            }
            .catalog-wing {
                position: relative;
                top: 0;
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Main Workspace Container -->
    <div class="library-container">
        
        <!-- Card Catalog System Dashboard Dock -->
        <aside class="catalog-wing">
            <div id="sigil-catalog"></div>
        </aside>
        
        <!-- 3D Geometric Bookshelf Framework Rack -->
        <main class="shelves-wing">
            <div id="sigil-shelves"></div>
        </main>
        
    </div>

    <!-- Core Runtime Execution Scripts (Order-Locked) -->
    <script src="js/catalog-data.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/shelves.js"></script>

    <!-- Runtime Engine Connection Instantiation -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 1. Mount and sort books on the 3D rows
        if (window.SigilShelves) {
          window.SigilShelves.init("sigil-shelves");
        }

        // 2. Initialize search metrics with a sync hook to the shelf wrapper objects
        if (window.SigilCatalog) {
          window.SigilCatalog.init("sigil-catalog", {
            onBeforeOpen: function (book) {
              if (window.SigilShelves) {
                window.SigilShelves.highlight(book.id);
              }
            }
          });
        }
      });
    </script>
</body>
</html>
