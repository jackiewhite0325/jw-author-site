<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigil and Scribe LLC | Immersive Library</title>
  <meta name="description" content="Sigil and Scribe LLC — an immersive 360 library showcasing books by J. White.">
  
  <!-- Open Graph Shared Metadata Assets -->
  <meta property="og:title" content="Sigil and Scribe LLC | Immersive Library">
  <meta property="og:description" content="Browse books by J. White in an immersive 360° library experience.">
  <meta property="og:image" content="images/site/social-share.jpg">
  
  <!-- Browser Target Favicons -->
  <link rel="icon" href="images/site/favicon.ico">
  <link rel="apple-touch-icon" href="images/site/favicon-180.png">
  
  <!-- Google Typography Core Fonts Sync Pipeline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
  
  <!-- Pannellum WebGL Engine Baseline CDN Layouts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
</head>

  <body>

  <!-- Accessible Skip Navigation Anchor -->
  <a href="#panorama-container" class="skip-link">Skip to library experience viewer</a>

  <!-- Main Immersive Room Viewport Container -->
  <main id="library-viewport-wrapper">
    
    <!-- Immersive Panorama Display Canvas Region -->
    <div id="panorama-container" role="region" aria-label="360 degree library room view"></div>

    <!-- Card Catalog Drawer Panel Overlay Box -->
    <div id="card-catalog-drawer" class="card-catalog-drawer" aria-live="polite">
      <div class="catalog-header">
        <h3>Card Catalog</h3>
        <button id="catalog-toggle-btn" class="catalog-minimize-btn" title="Minimize catalog" aria-label="Minimize catalog window">−</button>
      </div>
      
      <div class="catalog-select-wrapper">
        <label for="catalog-search-select" class="sr-only">Search books inside card catalog drawers</label>
        <select id="catalog-search-select" class="catalog-select">
          <option value="">-- Pull open a drawer --</option>
        </select>
      </div>
    </div>

    <!-- Smart Guidance Pulse Arrows -->
    <div id="guide-arrow-left" class="nav-guide-arrow" aria-hidden="true">←</div>
    <div id="guide-arrow-right" class="nav-guide-arrow" aria-hidden="true">→</div>

        <!-- Targeted Discovery Toast Invitation Banner -->
    <div id="invitation-toast" class="invitation-toast" role="alert" aria-live="assertive" aria-hidden="true">
      <p id="invitation-text">You targeted a volume shelf marker.</p>
      <div class="toast-actions">
        <button id="toast-accept-btn" class="btn btn-primary">Open Book</button>
        <button id="toast-dismiss-btn" class="btn btn-dismiss" onclick="dismissToast()">Keep Looking</button>
      </div>
    </div>

    <!-- Hotspot Overlay Dynamic Title Labels -->
    <div id="hotspot-label" class="hotspot-label" aria-hidden="true" style="display: none;"></div>
  </main>

  <!-- Third-Party Dependency Libraries Initialization Layer -->
  <script src="https://jsdelivr.net"></script>
  
  <!-- Universal Application Processing Engine Scripts -->
  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
