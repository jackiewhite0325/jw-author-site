<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigil and Scribe LLC | Immersive Library</title>
  
  <!-- Pannellum WebGL Engine Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Immersive Room Viewport Container (FULL PAGE) -->
  <main id="library-viewport-wrapper" style="position: fixed; width: 100vw; height: 100vh; overflow: hidden; top: 0; left: 0;">
    <div id="panorama-container" style="width: 100%; height: 100%;"></div>

    <!-- Card Catalog Drawer (Overlay on top of panorama) -->
    <div id="card-catalog-drawer" class="catalog-overlay">
      <div class="catalog-header">
        <h3 style="font-family: 'Playfair Display', serif; margin: 0;">Card Catalog</h3>
        <button id="catalog-toggle-btn" class="catalog-minimize-btn" title="Minimize catalog">−</button>
      </div>
      <select id="catalog-search-select" onchange="targetCatalogItem(this.value)" class="catalog-select">
        <option value="">-- Pull open a drawer --</option>
      </select>
    </div>

    <!-- Smart Guidance Indicators (Hidden by default, driven by math loop) -->
    <div id="guide-arrow-left" class="nav-guide-arrow">←</div>
    <div id="guide-arrow-right" class="nav-guide-arrow">→</div>

    <!-- "Everything Invites" Non-Intrusive Shortcut Invitation Card Toast -->
    <div id="invitation-toast" class="invitation-toast">
      <p id="invitation-text"></p>
      <div class="toast-actions">
        <button id="toast-accept-btn" class="btn-accept">Open Book</button>
        <button id="toast-dismiss-btn" class="btn-dismiss" onclick="dismissToast()">Keep Looking</button>
      </div>
    </div>

    <!-- Hotspot Overlay Labels (appear on hover) -->
    <div id="hotspot-label" class="hotspot-label" style="display: none;"></div>
  </main>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
