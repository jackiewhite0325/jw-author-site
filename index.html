<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sigil and Scribe LLC - Interactive Library</title>
    <!-- Core 3D engine scripts -->
    <script src="https://aframe.io"></script>
    <style>
        /* Block mobile browsers from dragging the entire page window around */
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        /* Style adjustments for user interface reading windows */
        .library-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 600px;
            background: #f4ebd0;
            border: 6px double #5c4033;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 9999;
            font-family: 'Georgia', serif;
            color: #2b1d0c;
        }
        .modal-active { display: block; }
        .close-btn { float: right; cursor: pointer; font-weight: bold; color: #5c4033; }
    </style>
</head>
<body>

    <!-- 2D Overlay Interface: Card Catalog Drawer (Mobile Centered Layout) -->
    <div id="cardCatalogDrawer" style="position:fixed; bottom:20px; left:5%; right:5%; z-index:100; background:#3e2723; color:#fff; padding:12px; border-radius:4px; font-family:serif; max-width: 90vw;">
        <h3 style="margin-top:0; margin-bottom:8px; font-size: 1.1rem;">📜 Card Catalog Drawer</h3>
        <input type="text" id="catalogSearch" placeholder="Search Title, Author, or Genre..." style="padding:8px; width:100%; box-sizing: border-box; border-radius: 4px; border: none;">
        <div id="catalogResults" style="max-height:120px; overflow-y:auto; margin-top:8px;"></div>
    </div>

    <!-- UI Overlay Popup for Reading Text Assets -->
    <div id="parchmentModal" class="library-modal">
        <span class="close-btn" onclick="closeParchment()">✕ Close</span>
        <h2 id="modalTitle" style="margin-top: 0; color: #5c4033;"></h2>
        <div id="modalContent"></div>
    </div>

    <!-- The 3D Panoramic Engine Canvas Scene Viewport -->
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable" embedded style="width: 100%; height: 100%;">
        <a-assets>
            <img id="libraryRoom" src="./images/site/victorian_library_360.png" crossorigin="anonymous">
        </a-assets>

        <!-- Equirectangular 360 Sky Component Background Mapping -->
        <a-sky src="#libraryRoom" rotation="0 -90 0"></a-sky>

        <!-- Interaction Zone Elements -->
        <a-plane id="muffinPoster" position="-3 2 -4" rotation="0 45 0" width="1.5" height="2" 
                 material="opacity: 0.01; transparent: true" class="clickable"
                 onclick="openParchment('Muffin\'s Memorial', 'In loving memory of the dog who inspired it all. Here lies the foundation of our creative stories.')"></a-plane>

        <a-box id="aboutDeskPapers" position="0 -1 -3" width="1" height="0.2" depth="0.8"
               material="opacity: 0.01; transparent: true" class="clickable"
               onclick="openParchment('About Sigil and Scribe LLC', 'Welcome to our collaborative library. We publish works across Fiction, Wellness, and Children\'s genres from multiple authors.')"></a-box>

        <a-box id="blogTypewriter" position="1 -1 -3" width="0.6" height="0.4" depth="0.6"
               material="opacity: 0.01; transparent: true" class="clickable"
               onclick="openParchment('The Scribe\'s Blog', 'Latest Update: Transitioning to our multi-author platform! Stay tuned for upcoming catalog additions from our writing partners.')"></a-box>

        <!-- Explicit Mobile-Optimized Tracking Viewport Camera -->
        
    </a-scene>
    <!-- Optimized Performance 3D Canvas Scene Viewport -->
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable" embedded renderer="antialias: false; precision: medium;" style="width: 100%; height: 100%;">

        
    <!-- Tracking Mechanics script link call -->
    <script src="./js/library-engine.js"></script>

        <!-- Add this block directly above your engine script hook line at the bottom -->
    <script>
        // Prevents the mobile browser from handling drag/scroll gestures over the 3D scene
        document.addEventListener('touchmove', function(e) {
            // Only block scrolling if a text modal reading pop-up is NOT open
            if (!document.getElementById('parchmentModal').classList.contains('modal-active')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>

    <!-- This is your existing line that stays at the very bottom -->
    <script src="./js/library-engine.js"></script>
</body>

    
</body>
</html>
