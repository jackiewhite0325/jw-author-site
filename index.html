<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigil and Scribe · Under Construction</title>
  <style>
    /* Minimalist layout tokens to be completely rewritten later */
    :root {
      --bg: #FDFBF7;
      --charcoal: #2B2B2B;
      --sage: #A3B19B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--charcoal);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
      line-height: 1.5;
    }

    main {
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      color: var(--charcoal);
      opacity: 0.8;
      margin-bottom: 32px;
    }

    .badge-placeholder {
      display: inline-block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sage);
      border: 1px dashed var(--sage);
      padding: 6px 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <main>
    <div class="badge-placeholder">Work in progress</div>
    <br><br>
    <h1>The writer's toolbox</h1>
    <p>We are currently re-arranging the shelf. Labels, visual placements, tool selections, and color palettes are being entirely overhauled to make the creative workspace feel right. Come back soon.</p>
  </main>

</body>
</html>
