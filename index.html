<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigil and Scribe LLC | Immersive Library</title>
  
  <!-- Pannellum WebGL Engine Libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Card Catalog Drawer Sidebar Interface (Visual Representation) -->
  <div id="card-catalog-drawer">
    <h3 style="font-family: 'Playfair Display', serif;">Card Catalog</h3>
    <select id="catalog-search-select" onchange="targetCatalogItem(this.value)">
      <option value="">-- Pull open a drawer --</option>
      <!-- Script handles population from libraryRegistry array dynamically -->
    </select>
  </div>

  <!-- Main Immersive Room Viewport Container -->
  <main id="library-viewport-wrapper" style="position: relative; width: 100vw; height: 100vh; overflow: hidden;">
    <div id="panorama-container" style="width: 100%; height: 100%;"></div>

    <!-- Smart Guidance Indicators (Hidden by default, driven by math loop) -->
    <div id="guide-arrow-left" class="nav-guide-arrow" style="display: none; position: absolute; left: 24px; top: 50%; transform: translateY(-50%); cursor: pointer;">←</div>
    <div id="guide-arrow-right" class="nav-guide-arrow" style="display: none; position: absolute; right: 24px; top: 50%; transform: translateY(-50%); cursor: pointer;">→</div>

    <!-- "Everything Invites" Non-Intrusive Shortcut Invitation Card Toast -->
    <div id="invitation-toast" style="display: none; position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);">
      <p id="invitation-text"></p>
      <div class="toast-actions">
        <button id="toast-accept-btn">Open Book</button>
        <button id="toast-dismiss-btn" onclick="dismissToast()">Keep Looking</button>
      </div>
    </div>
  </main>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
