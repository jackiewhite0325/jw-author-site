<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Memory of Muffin | J. White</title>
  <meta name="description" content="A tribute to Muffin, the real dog who inspired the Muffin the Pitbull Puppy series.">
  
  <!-- Open Graph Social Protocol Configurations -->
  <meta property="og:title" content="In Memory of Muffin | J. White">
  <meta property="og:image" content="images/site/social-share.jpg">
  
  <!-- Favicon Asset Configurations -->
  <link rel="icon" href="images/site/favicon.ico">
  <link rel="apple-touch-icon" href="images/site/favicon-180.png">
  
  <!-- Global Typography Font Arrays Sync -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  
  <!-- Core Design Application Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Memorial Page Custom Gallery Styles */
    .memorial-hero {
      text-align: center;
      padding: 4rem 1.5rem 2rem;
    }
    .memorial-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      margin: 0 0 0.5rem;
    }
    .memorial-hero p {
      font-style: italic;
      color: var(--sage-deep);
      font-size: 1.15rem;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .photo-grid img {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--mist);
    }
    
    @media (max-width: 600px) {
      .photo-grid {
        grid-template-columns: repeat(2, 1fr); /* Cap column threads to prevent mobile processing stalls */
        gap: 8px;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" style="background: var(--walnut-deep); color: var(--paper); padding: 16px 24px;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
      <a href="index.html" class="logo-link" style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.4rem;">Sigil & Scribe</a>
      <nav class="site-nav">
        <ul style="list-style: none; display: flex; gap: 16px; margin: 0;">
          <li><a href="index.html">Home</a></li>
          <li><a href="children.html">Children</a></li>
          <li><a href="muffin-memorial.html" style="color: var(--amber); font-weight: 600;">Memorial</a></li>
          <li><a href="blog.html">Blog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="memorial-hero">
      <h1>Muffin</h1>
      <p>In loving memory &middot; the dog who inspired it all</p>
    </section>

    <div class="photo-grid">
      <img src="images/muffin/muffin01.jpg" alt="Muffin the Pitbull puppy smiling" loading="lazy">
      <img src="images/muffin/muffin02.jpg" alt="Muffin playing with toys" loading="lazy">
      <img src="images/muffin/muffin03.jpg" alt="Muffin resting contentedly" loading="lazy">
    </div>
  </main>

</body>
</html>
