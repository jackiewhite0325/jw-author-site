<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — J. White</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin="">
<link href="https://googleapis.comcss2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body.thanks-page {
    background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 100%);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  .thanks-card {
    background: rgba(247, 241, 228, 0.05);
    border: 1px solid rgba(247, 241, 228, 0.15);
    border-radius: var(--radius);
    padding: 48px 32px;
    max-width: 480px;
    width: 100%;
    backdrop-filter: blur(4px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .thanks-card h1 {
    color: var(--cream);
    font-size: 2.2rem;
    margin-top: 12px;
  }
  .thanks-card p {
    color: rgba(247, 241, 228, 0.8);
    font-size: 1.05rem;
    margin-bottom: 32px;
    max-width: 38ch;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body class="thanks-page">

  <div class="thanks-card">
    <div class="eyebrow">
      <span class="firefly-dot"></span> Message Sent
    </div>
    <h1>Muffin's Mailbox is Open!</h1>
    <p>Thank you for reaching out. Your message has flown straight to my inbox, and I will read it over a warm cup of coffee soon.</p>
    <a href="index.html" class="btn btn-firefly">Back to the Shelves</a>
  </div>

</body>
</html>
